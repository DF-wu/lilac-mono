# yaml-language-server: $schema=./.schemas/core-config.schema.json
# Explicit numeric version: omission uses frozen v1; strings are invalid.
# null selects the v1 parser but fails its literal schema; omit it or use 1/2.
# Startup never rewrites/upgrades YAML. See docs/core-config-migrations.md.
# Most unknown keys warn and are ignored; invalid known values, removed fields,
# and unknown blobStorage keys fail validation. Model option warnings are not
# proof that an upstream supports an option.
# Reload validates config and refreshes consumers, but does not rebuild startup
# services. Restart boundaries and field-specific units are documented below.
configVersion: 2

# Managed opaque bytes use local storage below the runtime data directory by default.
# Adapter/root/bucket/credential changes require a Core restart. This is not a
# data migration: stop Core, copy all objects preserving IDs, verify references,
# then cut over. See MIGRATIONS.md (Core unified blob storage clean break).
# Set an absolute local root when the blob store lives elsewhere:
# blobStorage:
#   kind: local
#   root: /var/lib/lilac/blobs
#
# Or select an existing private S3-compatible bucket. Credential fields name
# environment variables; never put literal credentials in this file.
# blobStorage:
#   kind: s3
#   bucket: lilac
#   prefix: production/blobs
#   endpoint: https://s3.example.com
#   region: us-east-1
#   accessKeyIdEnv: LILAC_S3_ACCESS_KEY_ID
#   secretAccessKeyEnv: LILAC_S3_SECRET_ACCESS_KEY
#   sessionTokenEnv: LILAC_S3_SESSION_TOKEN
#   forcePathStyle: true

# Codex uses this for Responses instructions when codex_instructions is absent.
# Other providers prepend it to data/prompts/*.
basePrompt: "You are Lilac."

tools:
  # Filesystem implementation: fff (default) or node-rg; read by new toolsets.
  # fff provides indexed discovery/fuzzy_search; node-rg uses Node/ripgrep and
  # does not expose fuzzy_search. Startup prewarming is not rerun on reload.
  # fsBackend: fff
  web:
    extract:
      # Ordered, nonempty search/extraction chain; duplicates are removed.
      # Values: tavily, exa, firecrawl, openai (search only). Unconfigured providers
      # are skipped; retryable failures try the next provider, not every failure.
      # Credentials: TAVILY_API_KEY, EXA_API_KEY, FIRECRAWL_API_KEY, or OpenAI below.
      providers: [tavily]
    fetch:
      # Default web.fetch mode; a call may override it:
      # auto: HTTP -> browser -> providers on failure/weak content (not HTML),
      #       retaining browser content as a last fallback.
      # fetch: HTTP only; browser: browser only.
      # extract: providers -> browser on failure (except cancellation).
      # provider-only: providers only, with no HTTP/browser fallback.
      # web.extract always uses the provider chain, without browser fallback.
      mode: auto
    # Optional independent process-local limits for Firecrawl fetch and search calls.
    # queueTtl accepts positive milliseconds or ms/s/m/h/d/w/mo (mo = 30 days).
    # firecrawl:
    #   maxConcurrency: 2
    #   queueTtl: 3s
    # `openai` in extract.providers runs web.search through the OpenAI Responses web_search tool
    # (search-only, web.extract skips it). Dates are prompt guidance with this
    # provider, not enforced publication-date filters. `model` is the provider/model
    # that runs the hosted search: `openai/...` uses OPENAI_API_KEY / OPENAI_BASE_URL,
    # `openai-compatible/...` uses OPENAI_COMPATIBLE_API_KEY / OPENAI_COMPATIBLE_BASE_URL.
    # A bare model id means `openai/<id>`.
    # openai:
    #   model: openai/gpt-5-mini   # or openai-compatible/gpt-5.6-terra
    #   searchContextSize: medium
  inspect:
    # Must start with google/.
    model: google/gemini-3.5-flash
  editFile:
    hashline: true
  output:
    # Positive integer bytes or B/KB/MB/GB/KiB/MiB/GiB strings (case-sensitive).
    # Oversized tool text becomes an overflow reference to a scoped resource://
    # artifact; if storage fails, the full output cannot be recovered from it.
    maxPreviewBytes: 40KiB
    # Positive milliseconds or ms/s/m/h/d/w/mo; mo = 30 days. No unlimited.
    artifactTtl: 7d
    # Storage quota for transient tool-result artifacts, not all managed blobs.
    artifactMaxBytesPerSession: 50MiB
  historicalResultPruning:
    # Rewrites the model view of older tool results; not transcript retention.
    # Skips the latest human turn and protected tools. Thresholds are nonnegative
    # estimated token counts; pruning occurs only above minimumTokens.
    enabled: false
    # Keep this estimated recent eligible tool-output token budget.
    protectTokens: 40000
    minimumTokens: 20000
  media:
    # Decoded binary bytes in the model view; same positive byte units as output.
    # These limits do not govern uploads, text output, or artifact retention.
    # Oversized/unsupported binary parts degrade to metadata/resource markers.
    maxInlineBytesPerPart: 10MiB
    maxInlineBytesTotal: 20MiB
  generate:
    image:
      # Route for aliases without an entry in `routes`.
      # - default: the first configured provider in openai, openrouter, xai
      #   that serves the alias, with the alias's catalog model ID.
      # - openai-compatible: every alias goes to OPENAI_COMPATIBLE_BASE_URL
      #   (with OPENAI_COMPATIBLE_API_KEY) using its catalog model ID.
      # No route falls back to another provider after a failure.
      provider: default
      # Optional allowlist of Lilac aliases to advertise and serve. Omit to
      # consider every alias. Default-routed aliases without a configured
      # provider are not advertised; explicit routes and openai-compatible
      # routes stay advertised when their credentials are missing, so a call
      # reports the exact gap.
      # models: [nanobanana-2, gpt-image-2]
      # Optional per-alias routes as "<provider>/<model id>" with provider
      # openai, openrouter, xai, or openai-compatible. The model id may itself
      # contain slashes (OpenRouter slugs). Unlisted aliases follow `provider`.
      # routes:
      #   nanobanana-2: openai-compatible/gemini-3.1-flash-image-preview
      #   gpt-image-2: openrouter/openai/gpt-image-2

# External plugins are discovered under <DATA_DIR>/plugins; see PLUGIN_AUTHORING.md.
# Policy/config changes reload with tools. Plugin-specific schemas and lifecycle
# govern config payload validation; this is not a list of packages to install.
plugins:
  # Plugin IDs to disable (built-ins and external plugins).
  disabled: []
  # Opaque payloads keyed by plugin ID; interpreted by that plugin.
  config: {}

workflows:
  # Global admission cap across queued, running, blocked, and paused workflow runs.
  maxActiveRuns: 64

# WARN: This is an experimental feature, use at your own risk. Config, DB schema, and behavior may change.
conversation:
  thread:
    summarization:
      # Enable the background thread summarization worker. The hidden
      # conversation.thread.runSummarization tool can still be called manually.
      enabled: false
      # Model used to summarize threads. Accepts main, fast, a models.def alias,
      # or a direct provider/model ref.
      model: fast
      # Number of threads to summarize concurrently inside one run.
      concurrency: 1
      # Maximum threads processed by one periodic run. Manual runs are unbounded
      # unless they provide an explicit limit.
      batchSize: 32
      # Include MEMORY.md, USER.md, and optional ENTITIES.md as background-only
      # context for disambiguation during summarization.
      includePromptContext: false
    embedding:
      # Enable semantic thread embeddings. Summaries and lexical search still work
      # when this is disabled or when embedding generation fails.
      enabled: false
      # Provider/model ref or models.def alias for an AI SDK embedding model.
      model: openai/text-embedding-3-small
    autoInject:
      # Enable automatic injection of related thread title metadata before answers
      # to long, meaningful user messages.
      enabled: false
      # Optional model used to plan automatic thread search queries. When unset,
      # inherits conversation.thread.summarization.model. Accepts main, fast,
      # a models.def alias, or a direct provider/model ref.
      plannerModel: fast
      # Optional model used instead of plannerModel when the composed user input
      # contains only text. Accepts the same model values as plannerModel.
      # textPlannerModel: fast
      # Minimum authored text mass after removing URLs, Discord syntax, punctuation,
      # and discounting code blocks. 80 is a moderate Discord default.
      minTextUnits: 80
      # Higher threshold after this conversation already received auto-injected
      # thread metadata. This avoids re-searching for same-topic follow-ups.
      followUpMinTextUnits: 110
      # Max thread titles to inject.
      limit: 3
      # Minimum final search score after semantic/lexical ranking and aboutness
      # coverage. Use 0 for broad/debug recall.
      minScore: 0.1
      # Confidence cutoff for optional results 2..limit. The best remaining
      # candidate is kept when search returns one. 0.45-0.55 favors recall;
      # 0.65-0.75 favors precision. Tune this before minScore, which removes
      # candidates before confidence ranking.
      expansionMinConfidence: 0.57
      # Search mode for auto-injected metadata: hybrid, semantic, or lexical.
      mode: hybrid
      # Both llm and decision lanes: Discord/Telegram origins with recovered
      # participant IDs recall same-platform threads involving any of those IDs,
      # plus Native threads. The other messaging platform is excluded.
      # Native origins and requests without recovered IDs remain unfiltered by
      # participant, subject to normal candidate eligibility.
      filterCurrentParticipants: false
    # Which lane decides auto-injection when autoInject.enabled is true:
    # - llm: the length gate, planner model, and search ranking configured above.
    # - decision: one decision call judges the latest message and a local shortlist.
    #   TypeSafe uses TYPESAFE_AI_API_KEY and optional TYPESAFE_AI_BASE_URL.
    #   OpenAI uses OPENAI_API_KEY and optional OPENAI_BASE_URL, with native image inputs.
    #   Ignores the autoInject length, planner, score, and mode settings.
    autoInjectMode: llm
    decisionAutoInject:
      # Ordered model list. Text uses the first entry; attached images use the first
      # image-capable entry. Only the selected model's API key is required.
      # Add openai/gpt-6-luna after Jev to route images to Luna. This is not a retry chain.
      model: [typesafe/jev-1.13.0]
      # Max thread titles to inject.
      limit: 3
      # Maximum unique candidates. With embeddings, reserve half the slots for
      # lexical search and half for semantic search, then merge duplicates.
      candidateLimit: 40
      # Use the latest authored message and up to three recent authored user
      # messages. Images help judge the shortlist; image-only input still skips recall.
      # Enables concurrent semantic retrieval even when lexical matches exist.
      # False keeps lexical-only retrieval. Needs conversation.thread.embedding.
      semanticFallback: true
      jev:
        # Zero disables the message gate: select by candidate usefulness alone.
        # A positive value enables recall OR durable/non-casual message gating.
        recallMinProbability: 0
        # Used only when the recall threshold is positive and is not met.
        durableSubjectMinProbability: 0.6
        casualMaxProbability: 0.6
        # Minimum P(reading the thread helps respond) for each injected thread.
        relevanceMinProbability: 0.2
      luna:
        # F1-tuned text preset; image thresholds need further evaluation.
        recallMinProbability: 0
        durableSubjectMinProbability: 0.5
        casualMaxProbability: 0.3
        relevanceMinProbability: 0.1

surface:
  native:
    # Startup listener/auth/identity settings require restart: enabled, host, port,
    # publicUrl, installationId, allowedOrigins, auth and auth environment secrets.
    enabled: false
    host: 127.0.0.1
    port: 8789
    publicUrl: http://localhost:8789
    # Set a unique installationId before enabling.
    # installationId: your-installation-id
    allowedOrigins: [http://localhost:8789]
    auth:
      provider: local
      ownerId: owner
      # Clerk: set ownerProviderUserId and clerkIssuer; clerkOAuthClientId enables TUI login.
      # Local credentials: LILAC_NATIVE_LOCAL_USERNAME, LILAC_NATIVE_LOCAL_PASSWORD_HASH.
      # Session signing: LILAC_NATIVE_SESSION_SECRET (at least 32 bytes).
    # Native deployment settings live in the database. Edit Settings > Deployment.
    # Legacy YAML titleModel, outputStreaming, oldMessageSelectionMaxAgeMs,
    # storageRetentionMaxAgeMs and crossThreadSend seed ONLY an absent deployment
    # record; later YAML edits/restarts do not overwrite it. See migration guide.
    # Initial import values (optional):
    # titleModel: fast
    # outputStreaming: paragraph  # paragraph | complete
    # oldMessageSelectionMaxAgeMs: null  # null = no age limit; or positive duration
    # storageRetentionMaxAgeMs: null    # same units; not agent transcript retention
    # crossThreadSend: { triggerRun: true }
  # Router behavior is surface-wide (not per-adapter).
  router:
    # Routing modes:
    # - mention: only start a request on mention/reply-to-bot (default for guild channels)
    # - active: treat the channel like a DM (respond to everything)
    defaultMode: mention

    # Per-session overrides. Key is a session/channel id or Discord server/guild id.
    # Every option inherits independently. Precedence is thread/channel, parent
    # channel, guild, then the option's global default. An explicit value such as
    # additionalPrompts: [] disables broader inheritance for that option.
    # Reserved internal keys: "__heartbeat__" (canonical) and "heartbeat" (alias)
    # target the autonomous heartbeat lane.
    sessionModes: {}
    # sessionModes:
    #   "123456789012345678":
    #     # Optional: when omitted, this session inherits defaultMode.
    #     mode: active
    #     # Optional: use restricted mode for public/untrusted channels.
    #     # Restricted mode runs bash in an overlay filesystem: writes outside
    #     # /tmp are discarded after the request, while /tmp persists at
    #     # /tmp/lilac-restricted/<sessionId>.
    #     safetyMode: restricted
    #     # Optional: override the global activeGate.enabled for this channel.
    #     gate: false
    #     # Optional: override the request model for this session.
    #     # Accepts an alias from models.def or provider/model.
    #     model: "sonnet"
    #     # Optional: additional session memo entries appended to system prompt.
    #     # Entries can be literal text or file:// URLs.
    #     additionalPrompts:
    #       - "Keep replies concise for this session."
    #       - "file:///abs/path/to/session-memo.md"
    #   "234567890123456789": # Discord server/guild defaults
    #     mode: active
    #     gate: false
    #     model: "gpt-5.5"
    #     safetyMode: restricted
    #     additionalPrompts:
    #       - "Default memo for channels in this server."
    #   "__heartbeat__":
    #     # Optional: override the internal heartbeat lane model.
    #     # The convenience alias "heartbeat" is also accepted.
    #     model: "sonnet"

    # Integer milliseconds only (no friendly duration suffixes).
    # Debounce window (ms) for active mode initial prompt batching.
    activeDebounceMs: 3000

    # Active channel gate to prevent replying to everything.
    # When enabled, we run a lightweight model-based gate before forwarding.
    activeGate:
      enabled: false
      timeoutMs: 2500

  discord:
    tokenEnv: "DISCORD_TOKEN"

    # Connection tokenEnv, dbPath and memberPresence changes require restart.
    # Reuse downloaded Discord ingress attachments for this long. Set ttl to
    # "unlimited" to keep new cache objects without an expiry. Otherwise use positive
    # milliseconds or ms/s/m/h/d/w/mo (mo = 30 days). Reload affects new cache writes.
    attachmentCache:
      ttl: 30d

    # If both lists are empty, the bot will ignore all Discord traffic.
    allowedChannelIds: []
    allowedGuildIds: []

    # Display name used in attribution + mention stripping. Must not contain spaces.
    botName: "lilac"

    # Optional: override surface DB location (default: <dataDir>/discord-surface.db).
    # dbPath: "/path/to/discord-surface.db"

    # Optional: Discord custom presence/status message.
    # statusMessage: "ready"

    # Optional: enable Discord member presence intent.
    # memberPresence: false

    # Discord output rendering mode:
    # - inline: stream directly in the final reply embed (legacy behavior)
    # - preview: stream a transient preview window, then post a full final reply and
    #   delete the preview window
    outputMode: preview

    # Final reply style used after preview mode finishes:
    # - embed: repost the final answer as embed(s)
    # - plain: repost the final answer as normal Discord text message(s)
    # Only applies when outputMode is preview.
    outputPreviewModeFinalStyle: plain

    # Final plain-text grouping used after preview mode finishes:
    # - flat: reply with the first final-answer chunk, then send later chunks directly
    # - reply-chain: repost commentary + final answer as a reply chain
    # Only applies when outputMode is preview and outputPreviewModeFinalStyle is plain.
    outputPreviewModeFinalText: flat

    # Global override for Discord notifications on output messages.
    # - true: allow reply ping + @user mentions to notify
    # - false: suppress notifications by default
    outputNotification: true

    # Streaming embed title phrases for in-progress updates.
    # A random entry is selected and rotated periodically while the request is running.
    # Defaults live in packages/utils/working-indicators.ts.
    # workingIndicators: []

    # Discord-only markdown output features.
    markdownTableRender:
      # Enable Markdown table rendering.
      enabled: true
      # Style: unicode | ascii | image.
      # image: render top-level tables as PNG attachments in preview/plain/flat final output.
      # In other output modes, previews, or on image failure, image falls back to unicode.
      style: unicode
      # Max text-rendered table width (display cells, not bytes); also used by image fallback.
      maxWidth: 50
      # Fallback when a table cannot fit maxWidth:
      # - list: render a wrapped row/key-value list in a text codeblock
      # - passthrough: keep original markdown table unchanged
      fallbackMode: list

    markdownMathRender:
      # Render markdown math expressions. Disabled by default.
      enabled: false
      # Maximum rendered math width in display cells.
      maxWidth: 50
      # Fallback when math cannot render within maxWidth:
      # - source: show the original markdown math source as code
      # - passthrough: pass the original content through unchanged
      fallbackMode: source

  # Telegram surface (opt-in). Requires configVersion 2.
  # See docs/telegram-surface.md for BotFather setup and group privacy notes.
  telegram:
    # enabled/token/apiRoot/dbPath/commandMenu changes require a Core restart.
    # Allowlist/rendering settings can reload; botUsername is resolved at connect.
    # The adapter is only constructed when this is true (and token is set).
    enabled: false

    # Keep this file private: the token is stored directly in core-config.yaml.
    # token: "123456789:replace-with-your-bot-token"

    # Fails closed: while allowedChatIds is empty the bot ignores every chat.
    # Use numeric chat ids (negative for groups/supergroups), as strings.
    allowedChatIds: []

    # Optional second gate. Empty means "any user in an allowed chat".
    allowedUserIds: []

    # Display name used in attribution + mention stripping. Must not contain spaces.
    botName: "lilac"

    # Optional: the @username of the bot, without the leading "@".
    # Resolved from getMe on connect when omitted.
    # botUsername: "Catalina_agentbot"

    # Optional: override surface DB location (default: <dataDir>/telegram-surface.db).
    # Telegram has no history API, so the adapter keeps its own message index.
    # dbPath: "/path/to/telegram-surface.db"

    # Optional: Bot API endpoint. Telegram supports self-hosted Bot API servers,
    # which raise the file-size limits and keep traffic on your own network.
    # Must be a full URL. Changing it takes effect on restart.
    # Default: https://api.telegram.org
    # apiRoot: "http://127.0.0.1:8081"

    # What happens to the streamed messages when a request is cancelled.
    # Telegram edits in place, so a successful run looks identical either way.
    # - inline: leave the partial answer visible
    # - preview: delete the streamed messages on cancellation
    outputMode: preview

    # Message formatting sent to the Bot API:
    # - html: convert markdown to Telegram HTML (recommended)
    # - plain: send unformatted text
    parseMode: html

    # Integer milliseconds only, 500..60000 (no friendly duration suffixes).
    # Minimum gap between streaming edits. Telegram throttles edits at roughly
    # one per second per chat; lowering this trips 429 retry_after responses.
    streamEditIntervalMs: 1500

    # - true: allow messages to notify chat members
    # - false: send with disable_notification
    outputNotification: true

    # Publish the custom-command menu via setMyCommands on connect.
    #
    # Each command in <dataDir>/cmds is advertised as /lilac_<name>, with
    # hyphens mapped to underscores because Telegram only accepts
    # [a-z0-9_]{1,32}. The typed /lilac:<name> form keeps working either way.
    # An empty registry publishes an empty menu, so removing a command also
    # removes it from the menu.
    #
    # false leaves the bot's existing menu untouched.
    commandMenu: true

    # Inbound photo/document delivery to the model.
    #
    # Media is resolved from Telegram at composition time via the permanent
    # file_id (never a URL, so the bot token cannot reach composed content or
    # transcripts). Images and PDFs become inline file parts, text documents
    # are inlined as text, and audio/video/voice degrade to metadata markers.
    # Budgets bound decoded bytes; oversized media degrades to a marker.
    inboundMedia:
      # false restores caption-only behavior: media is dropped and an
      # uncaptioned photo does not start a run.
      enabled: true
      # Decoded-byte cap per attachment. Accepts friendly sizes ("5MiB").
      maxBytesPerAttachment: 5MiB
      # One decoded-byte budget across every attachment in a composed request,
      # including reply-chain history. The trigger message wins the budget
      # over older history.
      maxBytesPerRequest: 10MiB

    # Streaming title phrases for in-progress updates. At least one entry.
    # Defaults live in packages/utils/working-indicators.ts.
    # workingIndicators: [Composing, Distilling]

    # Telegram renders fixed-width tables well inside <pre> blocks.
    markdownTableRender:
      enabled: true
      # Style: unicode | ascii. The Discord-only image style is rejected here.
      style: unicode
      maxWidth: 50
      fallbackMode: list
  heartbeat:
    # Enable the internal autonomous heartbeat lane.
    enabled: false
    # Optional heartbeat model override lives under:
    # surface.router.sessionModes."__heartbeat__".model
    # The alias key "heartbeat" is also accepted.
    # Optional default output destination for proactive heartbeat messages.
    # Only discord or github is accepted (not native or telegram).
    # Discord: channel ID or configured entity.sessions.discord alias.
    # GitHub: github/OWNER/REPO#NUMBER, e.g. "github/DF-wu/lilac-mono#123".
    # Destination must exist and be accessible to the configured adapter.
    # defaultOutputSession: "discord/ops"
    # When heartbeat gets a chance to think (5-field minute-precision cron).
    cron: "*/30 * * * *"
    # Integer milliseconds only: quietAfterActivityMs >= 0, retryBusyMs > 0.
    # Suppress heartbeat for this long after any non-heartbeat request activity.
    quietAfterActivityMs: 300000
    # Retry suppressed wakes after this delay.
    retryBusyMs: 60000
    # Optional quiet-hours hint for heartbeat instructions only.
    # softQuietHours:
    #   start: "23:00"
    #   end: "08:00"
    #   timezone: "Asia/Taipei"

agent:
  # Retain completed request transcripts by age and count. maxAge accepts positive
  # milliseconds or ms/s/m/h/d/w/mo (mo = 30 days); maxRequests is a positive
  # integer count. Each independently accepts "unlimited". Reload applies on save.
  transcriptRetention:
    maxAge: 180d
    maxRequests: 10000

  # Optional: include token/model timing stats in final response metadata.
  # - false: disable stats metadata on response events
  # - true: enable concise stats line ([M], [T], [TTFT], [TPS])
  # - { verbose: true }: also include input composition ([IC] ...)
  statsForNerds: false

  # Discord-only streaming thinking display lane.
  # - none: hide reasoning lane content
  # - simple: show only the working title + elapsed request timer
  # - detailed: also show blockquoted reasoning content (clamped to 500 chars)
  reasoningDisplay: detailed

  # Stop a primary agent run after this long without model, tool, or subagent activity.
  # Active runs may continue indefinitely.
  # Integer milliseconds only, >= 1500; retry delays below are nonnegative integers.
  idleTimeoutMs: 900000

  retry:
    # Retry transient upstream failures and replay-safe primary-agent idle timeouts.
    enabled: true
    maxRetries: 3
    baseDelayMs: 2000
    maxDelayMs: 30000

  subagents:
    # Master switch for delegate-style subagents.
    enabled: true
    # Max delegation depth (primary=0). Default 2 allows self->(explore|general)
    # while explore/general remain non-delegating by policy.
    maxDepth: 2
    # Subagent idle timeout is derived from agent.idleTimeoutMs: floor(2/3),
    # with a 1000ms minimum.
    # Optional free-form guidance appended to the parent-visible
    # subagent_delegate tool description. Use this for model-routing policy,
    # escalation rules, cost guidance, or workflow-specific preferences.
    # delegatePromptOverlay: |
    #   Prefer inexpensive models for mechanical exploration.
    #   Escalate difficult architecture and review work to a stronger model.
    profiles:
      explore:
        modelSlot: main
        # Profile behavior applies identically to direct and workflow launches.
        level1:
          tools: [bash, read, glob, grep, fuzzy_search]
          plugins: [builtin-local-tools]
        level2:
          callables:
            [
              fetch,
              search,
              skills.list,
              skills.read,
              content.inspect,
              discovery.search,
              conversation.thread.search,
              surface.help,
              surface.sessions.listParticipants,
              surface.messages.list,
              surface.messages.read,
              surface.messages.search,
              surface.reactions.list,
              surface.reactions.listDetailed,
            ]
          plugins: [web, skills, content.inspect, discovery, conversation.thread, surface]
        # Behavioral/tool-surface settings. execution accepts false, restricted,
        # or native. restricted uses the virtual restricted Bash implementation;
        # native uses trusted host Bash unless the surface is restricted.
        network: true
        workspaceWrites: false
        execution: restricted
        delegation: false
        # Optional direct model override. Can be provider/model or an alias from models.def.
        # model: "openrouter/openai/gpt-4o"
        # Optional portable reasoning override for this subagent profile.
        # reasoning: low
        # Optional ordered fallback chain. A profile chain takes precedence over
        # the selected model slot or models.def alias chain.
        # fallback:
        #   - openrouter/openai/gpt-4o
        #   - model: openrouter/openai/gpt-4o-mini
        #     reasoning: none
        # options:
        #   openrouter:
        #     temperature: 0.0
        # Optional extra prompt fragment appended in explore mode.
        # promptOverlay: |
        #   Focus on codebase mapping, cite concrete file paths, and avoid edits.
      general:
        modelSlot: main
        # "*" includes every globally enabled built-in or external contribution.
        # MCP servers must also set allowSubagents: true in mcp-config.yaml.
        level1: { tools: ["*"], plugins: ["*"] }
        level2: { callables: ["*"], plugins: ["*"] }
        network: true
        workspaceWrites: true
        execution: native
        delegation: false
        # model: "openrouter/openai/gpt-4o"
        # reasoning: medium
        # options:
        #   openrouter:
        #     temperature: 0.1
        # Optional extra prompt fragment appended in general mode.
        # promptOverlay: |
        #   Prioritize execution over discussion and report concrete outcomes.
      self:
        modelSlot: main
        level1: { tools: ["*"], plugins: ["*"] }
        level2: { callables: ["*"], plugins: ["*"] }
        network: true
        workspaceWrites: true
        execution: native
        delegation: true
        # Self subagent is an isolated fork of the primary agent prompt/tooling.
        # model: "openrouter/openai/gpt-4o"
        # reasoning: high
        # options:
        #   openrouter:
        #     temperature: 0.2
        # Optional extra prompt fragment appended in self mode.
        # promptOverlay: |
        #   Assume no prior conversation context; restate assumptions briefly.

models:
  # Local Claude subscription models use claude-code/<model>, for example:
  # model: claude-code/claude-sonnet-4-6
  # Local runs may use an installed Claude CLI with existing authenticated config
  # or `claude auth login`. Core Docker can use the SDK-bundled executable with
  # CLAUDE_CODE_OAUTH_TOKEN and/or a mounted authenticated Claude config.
  # CLAUDE_CONFIG_DIR selects auth/config/native transcript storage and defaults
  # to ~/.claude. When set, it must be a non-empty absolute writable path; mount
  # it persistently in containers. A dedicated path separates operator storage,
  # not same-user access or privacy.
  # Stable named subagents require an exact canonical head; Discord primary
  # requires a retained terminal request plus an exact complete-segment lineage
  # prefix. First/missing/invalid/scope-mismatched state starts fresh persisted;
  # only an exact compatible continuation forks. Fork-heavy storage may grow
  # roughly quadratically and is not deleted by Core.
  # Runtime history families are ai-sdk and claude-code, not upstream vendors.
  # Explicit selection between these families uses lossy text replay. Automatic
  # fallback can switch vendors within ai-sdk, skips claude-code candidates,
  # and is disabled when the head uses claude-code.
  # Named presets: alias keys cannot contain "/"; model values must be provider/model.
  # Replace the empty registry with this ONE mapping when enabling the examples.
  def: {}
  # def:
  #   gpt-5.5:
  #     model: openai/gpt-5.5
  #     # Guidance is shown for dynamic subagent model selection, not a system prompt.
  #     comment: "Strong default for bounded coding and mechanical work."
  #     # Opt into dynamic subagent_delegate selection (default false); static
  #     # profiles, slots and human overrides are unaffected.
  #     agentCanSelect: true
  #     # Portable reasoning: provider-default | none | minimal | low | medium |
  #     # high | xhigh. Provider-native controls take precedence where supported.
  #     reasoning: high
  #     options:
  #       openai:
  #         reasoningEffort: high
  #     # All AI SDK vendors share a family. Retry budgets are exhausted per candidate.
  #     # [] explicitly suppresses inherited fallback; chains are flat, not recursive.
  #     fallback:
  #       - openai/gpt-5-mini
  #   opus:
  #     model: vercel/anthropic/claude-opus-4.8
  #     comment: "Use for architecture, difficult debugging, and critical review."
  #     reasoning: high
  #     options:
  #       anthropic:
  #         thinking:
  #           # Adaptive thinking has no budgetTokens; use it only with enabled thinking.
  #           type: adaptive
  #           display: summarized
  #       gateway:
  #         order: [anthropic, vertex, bedrock]
  #   sonnet:
  #     model: openrouter/anthropic/claude-sonnet-4.5
  #     options:
  #       # Optional cache-control injection for system/latest-user messages.
  #       # Cache writes may increase cost, especially with historical pruning.
  #       anthropic_prompt_cache: true
  #       openrouter:
  #         reasoning:
  #           enabled: true
  #           max_tokens: 12000

  main:
    # Can be either a full spec (provider/model) or an alias from models.def.
    model: "openrouter/openai/gpt-4o"
    # Optional portable AI SDK reasoning effort.
    # reasoning: provider-default
    # Optional ordered fallback chain. A slot chain takes precedence over a chain
    # declared by the models.def alias selected above. An ai-sdk head can switch
    # upstream vendors (OpenAI, Anthropic, OpenRouter, etc.) and skips claude-code
    # candidates; a claude-code head does not run automatic fallback.
    # fallback:
    #   - openrouter/anthropic/claude-sonnet-4.5
    #   - model: openrouter/openai/gpt-4o-mini
    #     reasoning: none
    # options:
    #   openrouter:
    #     temperature: 0.1
    # Alternative direct OpenAI configuration: replace BOTH model and options.
    # model: openai/gpt-5.5
    # options:
    #   # Append commentary/final_answer guidance for direct openai/codex.
    #   response_commentary: true
    #   # Permit server-side compaction for direct openai/codex only.
    #   openai_server_compaction: true
    #   openai:
    #     # Defaults to true; false requests sequential provider tool calls.
    #     parallelToolCalls: false
    # Non-official compatible upstream: replace BOTH model and options instead.
    # model: openai-compatible/your-model-id
    # options:
    #   openaiCompatible:
    #     reasoningEffort: medium
    # Options must be a flat provider-specific object OR a namespace map.
    # Do not mix flat fields with namespaces. Options vary by provider: temperature
    # is forwarded by OpenRouter, but is not an openai/openaiCompatible option here.

  # Fast/cheap model for lightweight features (router gate, etc.)
  fast:
    model: "openrouter/openai/gpt-4o-mini"
    # Optional: disable reasoning for lightweight gate/router work.
    # reasoning: none
    # fallback: [openrouter/openai/gpt-4o]
    # options:
    #   openrouter:
    #     temperature: 0.0

  capability:
    # Providers to always treat as unresolved when querying models.dev.
    # Suppresses registry lookup, not explicit overrides: overrides still resolve,
    # including inherit from a resolvable model. It does not block provider calls.
    forceUnknownProviders: ["openai-compatible"]

    # Optional manual capability overrides keyed by provider/model spec.
    # Useful when models.dev lags behind newly released models.
    overrides: {}
    # overrides:
    #   # Derive a new model capability from an existing upstream model.
    #   "openai-compatible/my-new-model":
    #     inherit: "openai/gpt-4o-mini"
    #     limit:
    #       context: 262144
    #
    #   # Full manual override (no inherit): limit.context is required at parsing and resolution.
    #   # No implicit registry base is merged. cost needs both input and output;
    #   # modalities needs input. Missing limit.output becomes 0; missing cost or
    #   # attachment/modalities remains unknown. Inherited partial patches can parse
    #   # yet fail resolution if their base is unavailable. Prices: USD / 1M tokens.
    #   "custom/private-model":
    #     limit:
    #       context: 131072
    #       output: 8192
    #     cost:
    #       input: 0.6
    #       output: 2.4
    #     modalities:
    #       input: [text, image, pdf]
    #       output: [text]
    #     attachment: true
    #
    #   # Inherited override with an explicit over-200k pricing tier patch.
    #   # Inherit a different spec: self-inheritance fails with an override cycle.
    #   # Note: this only affects cost estimation; limit.context remains what
    #   # you set here (or inherit from models.dev).
    #   "vercel/anthropic/claude-opus-4.6":
    #     inherit: "anthropic/claude-opus-4.6"
    #     cost:
    #       context_over_200k:
    #         input: 10
    #         output: 37.5
    #         cache_read: 1
    #         cache_write: 12.5

# Entity aliasing / mention rewriting (Discord only).
#
# This powers two conveniences:
# - outbound: "@Stanley" -> "<@123>" and "#ops" -> "<#456>"
# - inbound: "<@123>" -> "@Stanley" and "<#456>" -> "#ops"
#
# Notes:
# - Matches are case-insensitive; the canonical casing is preserved from config.
# - Tokens are sanitized (whitespace -> '_' and leading @/# stripped).
# - Optional comments are injected into the system prompt alongside alias + raw id.
#   Keep comments appropriate for agent-visible context; they are not private notes.
entity:
  users: {}
  sessions:
    discord: {}
# entity:
#   users:
#     Stanley:
#       discord: "123456789012345678"
#       comment: "Primary operator"
#
#   sessions:
#     discord:
#       ops:
#         discord: "234567890123456789"
#         comment: "Deploy coordination"
#       general: "345678901234567890"
