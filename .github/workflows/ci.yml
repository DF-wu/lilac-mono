name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # 同步流程驗證固定候選 SHA；重用所有既有 gate，不複製 CI 實作。
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to verify
        required: true
        type: string
      upstream_ref:
        description: Pinned upstream commit for the footprint gate
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Source checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      # GitHub has no Debian runners. Match the GNU coreutils in the Debian images.
      - name: Use GNU coreutils
        run: |
          sudo apt-get install -y --allow-remove-essential coreutils-from-gnu coreutils-from-uutils-
          cat --version | grep -F 'GNU coreutils'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI script
        run: bun run ci

  fork-footprint:
    name: Upstream footprint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Fetch upstream main
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          git remote add upstream https://github.com/stanley2058/lilac-mono.git
          git fetch --no-tags upstream "$UPSTREAM_REF"

      - name: Check modified upstream files against the allowlist
        env:
          LILAC_UPSTREAM_REF: FETCH_HEAD
        run: bun run fork:footprint -- --strict

  docker-image:
    name: Docker image smoke (${{ matrix.variant.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            container_user: lilac
            container_uid: 1000
          - name: catalina
            container_user: Catalina
            container_uid: 3000
          - name: claudia
            container_user: Claudia
            container_uid: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: |
            CONTAINER_USER=${{ matrix.variant.container_user }}
            CONTAINER_UID=${{ matrix.variant.container_uid }}
            LILAC_BUILD_COMMIT=${{ inputs.ref || github.sha }}
            LILAC_BUILD_DIRTY=false
          tags: lilac:ci-${{ matrix.variant.name }}
          cache-from: type=gha,scope=ci-${{ matrix.variant.name }}-amd64
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.variant.name }}-amd64

      - name: Verify image
        run: |
          bash docker/verify-image.sh \
            "lilac:ci-${{ matrix.variant.name }}" \
            "${{ matrix.variant.container_user }}" \
            "${{ matrix.variant.container_uid }}"

  computer-use:
    name: Computer-use Docker integration
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build runner and gateway images
        run: bun run docker:build:computer-use
      - name: Test Docker lifecycle
        run: bun run test:computer-use:docker
