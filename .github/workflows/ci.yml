name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # 同步流程驗證固定候選 SHA；重用所有既有 gate，不複製 CI 實作。
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to verify
        required: true
        type: string
      upstream_ref:
        description: Pinned upstream commit for the footprint gate
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each job runs one group of `scripts/run-gates.ts` gates, so CI and `bun run check` share one list.
  static:
    name: Lint, typecheck and static tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Run static gates
        run: bun scripts/run-gates.ts ci --group=static

  # The architecture lint takes most of the static time on a cold runner, so it gets its own.
  architecture:
    name: Architecture lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      - name: Run the architecture lint
        run: bun scripts/run-gates.ts ci --group=architecture

  core-tests:
    name: Core tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          rust: "true"
          go: "true"
          system-tools: "true"

      # apps/core/test-timings.json balances the shards by recorded file durations.
      - name: Run Core tests
        run: bun scripts/run-gates.ts ci --group=core --shard=${{ matrix.shard }}/3

  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      LILAC_BLOB_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      LILAC_BLOB_S3_TEST_BUCKET: lilac-blob-test
      LILAC_BLOB_S3_TEST_ACCESS_KEY_ID: lilac-ci-access
      LILAC_BLOB_S3_TEST_SECRET_ACCESS_KEY: lilac-ci-secret-key
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Production uses rustfs. Service env cannot read job env, so the credentials repeat.
      rustfs:
        image: rustfs/rustfs:1.0.4
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: lilac-ci-access
          RUSTFS_SECRET_KEY: lilac-ci-secret-key
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          rust: "true"
          go: "true"
          system-tools: "true"

      - name: Create the S3 test bucket
        run: >-
          curl --fail-with-body --silent --show-error
          --aws-sigv4 "aws:amz:us-east-1:s3"
          --user "$LILAC_BLOB_S3_TEST_ACCESS_KEY_ID:$LILAC_BLOB_S3_TEST_SECRET_ACCESS_KEY"
          -X PUT "$LILAC_BLOB_S3_TEST_ENDPOINT/$LILAC_BLOB_S3_TEST_BUCKET"

      - name: Run workspace tests
        run: bun scripts/run-gates.ts ci --group=tests

      - name: Test process and Redis resilience
        run: bun run test:resilience

  e2e:
    name: End-to-end scenarios (${{ matrix.shard }}/2)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace
        with:
          rust: "true"
          system-tools: "true"

      - name: Run end-to-end agent scenarios
        run: bun run test:e2e -- --shard=${{ matrix.shard }}/2

  # Keeps one stable status for the whole source pipeline.
  source-checks:
    name: Source checks
    if: always()
    needs: [static, architecture, core-tests, workspace-tests, e2e]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every source job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done

  fork-footprint:
    name: Upstream footprint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Fetch upstream main
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          git remote add upstream https://github.com/stanley2058/lilac-mono.git
          git fetch --no-tags upstream "$UPSTREAM_REF"

      - name: Check modified upstream files against the allowlist
        env:
          LILAC_UPSTREAM_REF: FETCH_HEAD
        run: bun run fork:footprint -- --strict

  docker-image:
    name: Docker image smoke (${{ matrix.variant.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            container_user: lilac
            container_uid: 1000
          - name: catalina
            container_user: Catalina
            container_uid: 3000
          - name: claudia
            container_user: Claudia
            container_uid: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: |
            CONTAINER_USER=${{ matrix.variant.container_user }}
            CONTAINER_UID=${{ matrix.variant.container_uid }}
            LILAC_BUILD_COMMIT=${{ inputs.ref || github.sha }}
            LILAC_BUILD_DIRTY=false
          tags: lilac:ci-${{ matrix.variant.name }}
          cache-from: type=gha,scope=ci-lilac-mono-amd64-${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=ci-lilac-mono-amd64-${{ matrix.variant.name }}

      - name: Verify image
        run: |
          bash docker/verify-image.sh \
            "lilac:ci-${{ matrix.variant.name }}" \
            "${{ matrix.variant.container_user }}" \
            "${{ matrix.variant.container_uid }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify installer-written deployment
        run: bun run docker:verify-installation lilac:ci-${{ matrix.variant.name }}

  computer-use:
    name: Computer-use Docker integration
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build runner and gateway images
        run: bun run docker:build:computer-use
      - name: Test Docker lifecycle
        run: bun run test:computer-use:docker
