name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI script
        run: bun run ci

  docker-image:
    name: Docker image smoke (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            container_user: lilac
            container_uid: 1000
          - name: catalina
            container_user: Catalina
            container_uid: 3000
          - name: claudia
            container_user: Claudia
            container_uid: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg "CONTAINER_USER=${{ matrix.variant.container_user }}" \
            --build-arg "CONTAINER_UID=${{ matrix.variant.container_uid }}" \
            --tag "lilac:ci-${{ matrix.variant.name }}" \
            .

      - name: Verify image
        run: |
          bash docker/verify-image.sh \
            "lilac:ci-${{ matrix.variant.name }}" \
            "${{ matrix.variant.container_user }}" \
            "${{ matrix.variant.container_uid }}"
