name: Build & Push Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      verified_sha:
        description: Exact candidate already verified and fast-forwarded by Sync Upstream
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUBLISH_SHA: ${{ inputs.verified_sha || github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - tag: catalina
            container_user: Catalina
            container_uid: 3000
          - tag: claudia
            container_user: Claudia
            container_uid: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PUBLISH_SHA }}
          submodules: false  # ref/ submodules not needed for build

      - name: Require verification for the exact published commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PUBLISH_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PUBLISH_SHA"
          if [ -n "$VERIFIED_SHA" ]; then
            test "$VERIFIED_SHA" = "$PUBLISH_SHA"
            exit 0
          fi
          count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$PUBLISH_SHA" -f status=success -f event=push -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_sha == env.PUBLISH_SHA and .conclusion == "success")] | length')
          if [ "$count" -eq 0 ]; then
            echo "Image publication requires successful push CI for $PUBLISH_SHA." >&2
            exit 1
          fi

      - name: Select source identity
        id: source
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.variant.tag }}
            type=raw,value=latest,enable=${{ matrix.variant.tag == 'catalina' }}
            type=raw,value=${{ matrix.variant.tag }}-${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ env.PUBLISH_SHA }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: |
            CONTAINER_USER=${{ matrix.variant.container_user }}
            CONTAINER_UID=${{ matrix.variant.container_uid }}
            LILAC_BUILD_VERSION=${{ matrix.variant.tag }}-${{ steps.source.outputs.short_sha }}
            LILAC_BUILD_COMMIT=${{ env.PUBLISH_SHA }}
            LILAC_BUILD_DIRTY=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.variant.tag }}-amd64
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.variant.tag }}-amd64

      - name: Verify image identity and runtime isolation
        env:
          VERIFY_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          bash docker/verify-image.sh \
            "$VERIFY_IMAGE" \
            "${{ matrix.variant.container_user }}" \
            "${{ matrix.variant.container_uid }}"

      - name: Push verified image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PUBLISH_SHA"
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$IMAGE_TAGS"
