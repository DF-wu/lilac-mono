configVersion: 1

providers:
  # The published mini-lilac bundle requires an external Claude CLI on PATH.
  # Use existing authenticated config or run `claude auth login`. A custom
  # container must install/mount that CLI and supply authentication explicitly.
  # CLAUDE_CONFIG_DIR defaults to ~/.claude; when set, it must be a non-empty
  # absolute writable path and must be persistently mounted for continuation.
  # A dedicated directory separates storage but is not a same-user security or
  # privacy boundary.
  # Credentialless: this provider must have no entry in auth.json, and Lilac
  # never reads or stores the Claude credential. Models come from Anthropic's
  # models.dev metadata; `catalog: v1` and `baseUrl` are rejected.
  # Mini main and named subagents continue through exact clean native bindings
  # after restart. Reuse an automatically generated returned name to continue it.
  # First/missing/invalid/scope-mismatched state starts fresh persisted; only an
  # exact compatible continuation forks. Explicit cross-family selection uses
  # lossy text replay. Attempts/current named bindings are bounded, while Mini
  # main bindings remain with retained history states and may grow. Lilac does
  # not delete Claude-owned transcript files.
  # claude-code:
  #   type: claude-code
  #   catalog: models-dev

  openai:
    type: openai
    # Uses Lilac Codex OAuth when available, otherwise the key in auth.json.
    catalog: models-dev
    # Optional patches applied after catalog discovery. Unspecified fields inherit.
    models:
      gpt-5.6-sol:
        # Available only on type: openai providers. Omit or set false to disable.
        # openaiServerCompaction: true
        limit:
          context: 372000
          # output: 32768
