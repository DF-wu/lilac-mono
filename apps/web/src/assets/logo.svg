<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Lilac blossoms">
  <title>Lilac</title>
  <defs>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="186" ry="186"/></clipPath>

    <radialGradient id="bg" cx="31%" cy="44%" r="84%">
      <stop offset="0"    stop-color="#553272"/>
      <stop offset="0.40" stop-color="#381e4d"/>
      <stop offset="0.76" stop-color="#1d0e29"/>
      <stop offset="1"    stop-color="#0b040f"/>
    </radialGradient>
    <radialGradient id="vignette" cx="40%" cy="42%" r="70%">
      <stop offset="0.50" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <!-- petal body: bright toward the outer half, cooler toward the throat -->
    <radialGradient id="pLight" cx="0.44" cy="0.38" r="0.72">
      <stop offset="0"    stop-color="#e6e0fa"/>
      <stop offset="0.48" stop-color="#cabcec"/>
      <stop offset="0.85" stop-color="#ab98d8"/>
      <stop offset="1"    stop-color="#9a85cb"/>
    </radialGradient>
    <radialGradient id="pMid" cx="0.44" cy="0.38" r="0.72">
      <stop offset="0"    stop-color="#dcd4f6"/>
      <stop offset="0.48" stop-color="#bfb0e6"/>
      <stop offset="0.85" stop-color="#9e8ace"/>
      <stop offset="1"    stop-color="#8b76c0"/>
    </radialGradient>
    <radialGradient id="pDark" cx="0.44" cy="0.38" r="0.72">
      <stop offset="0"    stop-color="#cec5ef"/>
      <stop offset="0.48" stop-color="#b0a0dd"/>
      <stop offset="0.85" stop-color="#8e79c3"/>
      <stop offset="1"    stop-color="#7b66b0"/>
    </radialGradient>

    <radialGradient id="petalEdge" cx="0.48" cy="0.50" r="0.62">
      <stop offset="0.55" stop-color="#3d2166" stop-opacity="0"/>
      <stop offset="1"    stop-color="#2f1758" stop-opacity="0.34"/>
    </radialGradient>
    <radialGradient id="petalBase" cx="0.5" cy="1" r="0.46">
      <stop offset="0" stop-color="#3f2364" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#3f2364" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.46"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- single light source, upper-left, shared by every blossom -->
    <linearGradient id="globalLight" gradientUnits="userSpaceOnUse" x1="150" y1="110" x2="900" y2="980">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.52" stop-color="#2b1149" stop-opacity="0"/>
      <stop offset="1"    stop-color="#2b1149" stop-opacity="0.30"/>
    </linearGradient>

    <radialGradient id="coreShade">
      <stop offset="0"   stop-color="#381d5c" stop-opacity="0.46"/>
      <stop offset="0.6" stop-color="#381d5c" stop-opacity="0.20"/>
      <stop offset="1"   stop-color="#381d5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bud" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0"    stop-color="#fffbf1"/>
      <stop offset="0.45" stop-color="#f9e5bd"/>
      <stop offset="0.85" stop-color="#ecce99"/>
      <stop offset="1"    stop-color="#cca471"/>
    </radialGradient>

    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="10" dy="18" stdDeviation="22" flood-color="#140622" flood-opacity="0.55"/>
    </filter>

    <filter id="petalSep" x="-35%" y="-35%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx=".018" dy=".026" stdDeviation=".028" flood-color="#25104a" flood-opacity="0.75"/>
    </filter>

    <path id="petalShape" d="M0 0C-.12 -.10 -.32 -.28 -.38 -.55C-.44 -.80 -.28 -1.00 0 -1.00C.28 -1.00 .44 -.80 .38 -.55C.32 -.28 .12 -.10 0 0Z"/>

    <g id="petal" filter="url(#petalSep)">
      <use href="#petalShape"/>
      <use href="#petalShape" fill="url(#petalEdge)"/>
      <use href="#petalShape" fill="url(#petalBase)"/>
      <ellipse fill="url(#sheen)" cx="-.11" cy="-.60" rx=".115" ry=".30" transform="rotate(-10 -.11 -.60)"/>
    </g>

    <g id="core">
      <circle fill="url(#coreShade)" cx="0" cy="0" r=".20"/>
      <circle fill="url(#bud)" cx="0"     cy="-.055" r=".056"/>
      <circle fill="url(#bud)" cx="-.058" cy="-.012" r=".053"/>
      <circle fill="url(#bud)" cx=".058"  cy="-.018" r=".053"/>
      <circle fill="url(#bud)" cx="-.038" cy=".052"  r=".050"/>
      <circle fill="url(#bud)" cx=".044"  cy=".050"  r=".050"/>
      <circle fill="url(#bud)" cx=".002"  cy=".004"  r=".045"/>
    </g>

    <g id="blossomA">
      <g transform="rotate(-56)"><use href="#petal" fill="url(#pLight)"/></g>
      <g transform="rotate(16)"><use href="#petal" fill="url(#pLight)"/></g>
      <g transform="rotate(88)"><use href="#petal" fill="url(#pDark)"/></g>
      <g transform="rotate(160)"><use href="#petal" fill="url(#pDark)"/></g>
      <g transform="rotate(232)"><use href="#petal" fill="url(#pMid)"/></g>
      <use href="#core"/>
    </g>
    <g id="blossomA-sil" fill="#fff">
      <g transform="rotate(-56)"><use href="#petalShape"/></g>
      <g transform="rotate(16)"><use href="#petalShape"/></g>
      <g transform="rotate(88)"><use href="#petalShape"/></g>
      <g transform="rotate(160)"><use href="#petalShape"/></g>
      <g transform="rotate(232)"><use href="#petalShape"/></g>
    </g>

    <g id="blossomB">
      <g transform="rotate(-44)"><use href="#petal" fill="url(#pLight)"/></g>
      <g transform="rotate(28)"><use href="#petal" fill="url(#pMid)"/></g>
      <g transform="rotate(100)"><use href="#petal" fill="url(#pDark)"/></g>
      <g transform="rotate(172)"><use href="#petal" fill="url(#pDark)"/></g>
      <g transform="rotate(244)"><use href="#petal" fill="url(#pMid)"/></g>
      <use href="#core"/>
    </g>
    <g id="blossomB-sil" fill="#fff">
      <g transform="rotate(-44)"><use href="#petalShape"/></g>
      <g transform="rotate(28)"><use href="#petalShape"/></g>
      <g transform="rotate(100)"><use href="#petalShape"/></g>
      <g transform="rotate(172)"><use href="#petalShape"/></g>
      <g transform="rotate(244)"><use href="#petalShape"/></g>
    </g>

    <g id="blossomC">
      <g transform="rotate(-50)"><use href="#petal" fill="url(#pLight)"/></g>
      <g transform="rotate(22)"><use href="#petal" fill="url(#pMid)"/></g>
      <g transform="rotate(94)"><use href="#petal" fill="url(#pDark)"/></g>
      <g transform="rotate(166)"><use href="#petal" fill="url(#pDark)"/></g>
      <g transform="rotate(238)"><use href="#petal" fill="url(#pMid)"/></g>
      <use href="#core"/>
    </g>
    <g id="blossomC-sil" fill="#fff">
      <g transform="rotate(-50)"><use href="#petalShape"/></g>
      <g transform="rotate(22)"><use href="#petalShape"/></g>
      <g transform="rotate(94)"><use href="#petalShape"/></g>
      <g transform="rotate(166)"><use href="#petalShape"/></g>
      <g transform="rotate(238)"><use href="#petalShape"/></g>
    </g>

    <mask id="mA" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g transform="translate(376 644) scale(300)"><use href="#blossomA-sil"/></g>
    </mask>
    <mask id="mB" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g transform="translate(632 408) scale(230)"><use href="#blossomB-sil"/></g>
    </mask>
    <mask id="mC" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g transform="translate(770 218) scale(145)"><use href="#blossomC-sil"/></g>
    </mask>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>

    <g filter="url(#drop)">
      <g transform="translate(770 218) scale(145)"><use href="#blossomC"/></g>
    </g>
    <rect width="1024" height="1024" fill="url(#globalLight)" mask="url(#mC)"/>

    <g filter="url(#drop)">
      <g transform="translate(632 408) scale(230)"><use href="#blossomB"/></g>
    </g>
    <rect width="1024" height="1024" fill="url(#globalLight)" mask="url(#mB)"/>

    <g filter="url(#drop)">
      <g transform="translate(376 644) scale(300)"><use href="#blossomA"/></g>
    </g>
    <rect width="1024" height="1024" fill="url(#globalLight)" mask="url(#mA)"/>
  </g>
</svg>
